<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <title>Saltline</title>
    <meta name="claude:viewport-fit-sides" content="cover" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;700;900&family=IBM+Plex+Mono:wght@400;500&family=Barlow+Condensed:wght@400;500;600&display=swap"
    />
    <link rel="stylesheet" href="css/game.css" />
    <link rel="stylesheet" href="css/mp.css" />
    <script>
      // Pick the language before first paint so the boot screen is not
      // re-labelled mid-load. Mirrors js/i18n.js detect().
      (function () {
        var L = null;
        try {
          var q = new URLSearchParams(location.search).get("lang");
          if (q) L = /^zh/i.test(q) ? "zh" : /^en/i.test(q) ? "en" : null;
        } catch (e) {}
        if (!L) {
          try {
            var s = localStorage.getItem("saltline.lang.v1");
            if (s === "zh" || s === "en") L = s;
          } catch (e) {}
        }
        if (!L) {
          var list =
            navigator.languages && navigator.languages.length
              ? navigator.languages
              : [navigator.language || "en"];
          for (var i = 0; i < list.length; i++) {
            if (/^zh\b|^zh-/i.test(String(list[i]))) {
              L = "zh";
              break;
            }
          }
        }
        L = L || "en";
        document.documentElement.lang = L === "zh" ? "zh-CN" : "en";
        document.documentElement.dataset.lang = L;
        window.__SALTLINE_LANG = L;
        if (L === "zh") document.title = "盐线";
      })();
    </script>
  </head>
  <body>
    <div id="app">
      <canvas id="view" tabindex="0"></canvas>
      <div id="ui"></div>
      <div id="boot">
        <div class="boot-mark">SALTLINE</div>
        <div class="boot-sub" id="boot-msg">Raising the terminal</div>
        <div class="boot-bar"><i id="boot-fill"></i></div>
      </div>
    </div>
    <script type="module" src="js/game.js"></script>
  </body>
</html>
